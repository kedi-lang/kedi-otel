[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "opentelemetry-instrumentation-kedi"
version = "0.1.0"
description = "OpenTelemetry instrumentation for the Kedi programming language"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "kedi>=0.4,<0.5",
    "opentelemetry-api>=1.45.2,<1.46",
    "opentelemetry-instrumentation>=0.66b2,<0.67",
    "pydantic-ai-slim>=2.66.0,<2.67",
]

[project.urls]
Homepage = "https://github.com/kedi-lang/kedi-otel"
Repository = "https://github.com/kedi-lang/kedi-otel"
Issues = "https://github.com/kedi-lang/kedi-otel/issues"

[project.optional-dependencies]
httpx = ["opentelemetry-instrumentation-httpx>=0.66b2,<0.67"]
test = [
    "opentelemetry-sdk>=1.45.2,<1.46",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
]

[project.entry-points.opentelemetry_instrumentor]
kedi = "opentelemetry.instrumentation.kedi:KediInstrumentor"

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]

[tool.uv.sources]
kedi = { path = "..", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Ruff 0.17 widened its default rule set; keep the rules this project was linted with.
select = ["E4", "E7", "E9", "F"]
