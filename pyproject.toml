[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentelemetry-instrumentation-kedi"
version = "0.1.0"
description = "OpenTelemetry instrumentation for the Kedi programming language"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "kedi>=0.4.0",
    "opentelemetry-api>=1.30",
    "opentelemetry-instrumentation>=0.51b0",
    "pydantic-ai-slim>=2.23.0,<3",
]

[project.urls]
Homepage = "https://github.com/kedi-lang/kedi-otel"
Repository = "https://github.com/kedi-lang/kedi-otel"
Issues = "https://github.com/kedi-lang/kedi-otel/issues"

[project.optional-dependencies]
httpx = ["opentelemetry-instrumentation-httpx>=0.51b0"]
test = [
    "opentelemetry-sdk>=1.30",
    "pytest>=8.2",
    "pytest-cov>=7.1",
]

[project.entry-points.opentelemetry_instrumentor]
kedi = "opentelemetry.instrumentation.kedi:KediInstrumentor"

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]

[tool.ruff]
line-length = 100
target-version = "py310"
