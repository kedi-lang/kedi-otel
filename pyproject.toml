[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "opentelemetry-instrumentation-kedi"
version = "0.1.0"
description = "OpenTelemetry instrumentation for the Kedi programming language"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "kedi>=0.4,<0.5",
    "opentelemetry-api>=1.44,<1.45",
    "opentelemetry-instrumentation>=0.65b0,<0.66",
    "pydantic-ai-slim==2.36.0",
]

[project.urls]
Homepage = "https://github.com/kedi-lang/kedi-otel"
Repository = "https://github.com/kedi-lang/kedi-otel"
Issues = "https://github.com/kedi-lang/kedi-otel/issues"

[project.optional-dependencies]
httpx = ["opentelemetry-instrumentation-httpx>=0.65b0,<0.66"]
test = [
    "opentelemetry-sdk>=1.44,<1.45",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
]

[project.entry-points.opentelemetry_instrumentor]
kedi = "opentelemetry.instrumentation.kedi:KediInstrumentor"

[tool.hatch.build.targets.wheel]
packages = ["src/opentelemetry"]

[tool.uv.sources]
kedi = { path = "..", editable = true }

[tool.ruff]
line-length = 100
target-version = "py310"
